<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GovtPrep — Study Plan</title>
<link rel="stylesheet" href="shared.css">
<style>
.day-card{display:flex;gap:16px;padding:16px;border-radius:16px;background:rgba(240,243,247,0.5);border:1px solid rgba(255,255,255,0.4);box-shadow:3px 3px 8px rgba(163,177,198,0.3),-3px -3px 8px rgba(255,255,255,0.7);margin-bottom:14px;align-items:center;}
.day-num{width:46px;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,0.6);box-shadow:2px 2px 6px rgba(163,177,198,0.3);flex-shrink:0;}
.day-num span:first-child{font-size:.65rem;text-transform:uppercase;font-weight:700;color:#6b7280;}
.day-num span:last-child{font-size:1.1rem;font-weight:800;color:#4f46e5;line-height:1;}
.day-content{flex:1;}
.day-title{font-size:.88rem;font-weight:700;color:#1f2937;margin-bottom:3px;}
.day-tasks{font-size:.76rem;color:#6b7280;}
.day-status{flex-shrink:0;}
.checkbox-wrap{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#e0e5ec;box-shadow:inset 2px 2px 4px rgba(163,177,198,0.5),inset -2px -2px 4px rgba(255,255,255,0.8);cursor:pointer;position:relative;}
.checkbox-wrap.checked::after{content:'✓';font-size:.9rem;color:#16a34a;font-weight:800;}
.loading-spinner{width:40px;height:40px;border:4px solid rgba(79,70,229,0.1);border-left-color:#4f46e5;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{text-align:center;color:#6b7280;font-size:.85rem;padding:20px;}
.error-text{text-align:center;color:#b91c1c;font-size:.85rem;padding:20px;}
</style>
</head>
<body>

  <div class="sidebar-logo">

    <div><div class="logo-text">GovtPrep</div><div class="logo-sub">Student Portal</div></div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Main</div>
    <a href="student-dashboard.html" class="nav-item"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
    <a href="student-courses.html" class="nav-item"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>My Courses</a>
    <a href="student-tests.html" class="nav-item"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Mock Tests</a>
    <a href="student-performance.html" class="nav-item"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Performance</a>
  </div>
  <div class="nav-section">
    <div class="nav-label">Study</div>
    <a href="student-practice.html" class="nav-item"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>Practice Zone</a>
    <a href="student-plan.html" class="nav-item active"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Study Plan</a>

</aside>

<main class="main">
  <div class="topbar">
    <div><h1>Study Plan</h1><p>Organize your preparation schedules</p></div>
    <div class="topbar-right">
      <button class="hamburger" onclick="toggleSidebar()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <button class="notif-btn"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot"></span></button>
      <div class="avatar" id="avatarInitials">RS</div>
    </div>
  </div>

  <div id="planLoading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading your study plan...</div>
  </div>

  <div id="planContent" style="display:none;">
    <div class="grid-2">
      <div>
        <div class="card">
          <div class="card-header"><span class="section-title">Weekly Tasks</span><span class="tag active" id="weekLabel">Week Plan</span></div>
          <div id="tasksContainer"></div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="section-title" style="margin-bottom:14px;">Goal Progression</div>
          <div style="text-align:center;padding:10px 0;" id="goalProgression">
            <div style="font-size:2.5rem;font-weight:800;color:#4f46e5;" id="goalPercent">0%</div>
            <div style="font-size:.76rem;color:#6b7280;font-weight:500;margin-top:2px;" id="goalLabel">Weekly Target Met</div>
            <div class="prog-bar-bg" style="margin-top:12px;"><div class="prog-bar" id="goalBar" style="width:0%;background:linear-gradient(90deg,#6366f1,#a5b4fc);"></div></div>
          </div>
        </div>

        <div class="card">
          <div class="section-title" style="margin-bottom:14px;">Custom Study Plan</div>
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div class="form-group"><label>Daily Target Hours</label><input type="number" class="form-input" value="6" min="1" max="18"></div>
            <div class="form-group"><label>Focus Exam Goal</label><select class="form-select"><option>UPSC CSE Goal</option><option>SSC CGL Goal</option><option>IBPS PO Goal</option></select></div>
            <button class="cta-btn btn-block" onclick="alert('Goal updated successfully!')">Save Goal Preferences</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<script>
const API = 'https://govtprep.onrender.com/api';
const userId = localStorage.getItem('userId');

const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

async function loadPlan() {
  const loading = document.getElementById('planLoading');
  const content = document.getElementById('planContent');

  try {
    const res = await fetch(`${API}/study-plan`);
    if (!res.ok) throw new Error('Failed to fetch study plan');
    const raw = await res.json();
    const plans = raw.data || [];
    const plan = plans[0] || {};
    const tasks = plan.tasks || [];
    const weekNum = plan.week || 'Current';
    document.getElementById('weekLabel').textContent = `Week ${weekNum}`;

    const tasksContainer = document.getElementById('tasksContainer');

    if (tasks.length > 0) {
      const completed = tasks.filter(t => t.completed).length;
      const total = tasks.length;
      const pct = total ? Math.round((completed / total) * 100) : 0;

      document.getElementById('goalPercent').textContent = pct + '%';
      document.getElementById('goalBar').style.width = pct + '%';
      document.getElementById('goalLabel').textContent = `${completed}/${total} Tasks Done`;

      tasksContainer.innerHTML = tasks.map(t => {
        const dayNum = t.dayNumber || '';
        const dayAbbr = dayNames[(t.dayOfWeek || 0) % 7];
        return `
          <div class="day-card">
            <div class="day-num"><span>${dayAbbr}</span><span>${dayNum}</span></div>
            <div class="day-content"><div class="day-title">${t.title}</div><div class="day-tasks">${t.description || ''}</div></div>
            <div class="day-status"><div class="checkbox-wrap ${t.completed ? 'checked' : ''}" onclick="this.classList.toggle('checked')"></div></div>
          </div>
        `;
      }).join('');
    } else {
      tasksContainer.innerHTML = '<div class="loading-text">No tasks for this week. Create a custom plan!</div>';
    }

    loading.style.display = 'none';
    content.style.display = 'block';
  } catch (err) {
    console.warn('Plan load error:', err);
    loading.innerHTML = '<div class="error-text">Could not load study plan. Please try again later.</div>';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadPlan();
});

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open');}
</script>
</body>
</html>
