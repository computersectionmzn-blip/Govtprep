<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GovtPrep Admin — Courses</title>
<link rel="stylesheet" href="shared.css">
<style>
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:20px;}
.course-card{background:rgba(255,255,255,.32);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.5);border-radius:18px;box-shadow:6px 6px 16px rgba(163,177,198,.55),-6px -6px 16px rgba(255,255,255,.85);padding:20px;display:flex;flex-direction:column;gap:10px;}
.course-emoji{font-size:2rem;}
.course-title{font-size:.95rem;font-weight:700;color:#1f2937;}
.course-meta{font-size:.77rem;color:#6b7280;}
.course-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
@media(max-width:900px){.course-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.course-grid{grid-template-columns:1fr;}}
.loading{text-align:center;padding:30px;color:#6b7280;font-size:.9rem;grid-column:1/-1;}
.error{text-align:center;padding:30px;color:#b91c1c;font-size:.9rem;grid-column:1/-1;}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark"><svg width="22" height="22" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="7" stroke="#4f46e5" stroke-width="2"/><path d="M16 2v4M16 26v4M2 16h4M26 16h4" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="3" fill="#4f46e5"/></svg></div>
    <div><div class="logo-text">GovtPrep</div><div class="logo-sub">Admin Panel</div></div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Overview</div>
    <a href="admin-dashboard.html" class="nav-item"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
    <a href="admin-students.html" class="nav-item"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Students</a>
    <a href="admin-courses.html" class="nav-item active"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Courses</a>
    <a href="admin-tests.html" class="nav-item"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Mock Tests</a>
  </div>
  <div class="nav-section">
    <div class="nav-label">Manage</div>
    <a href="admin-payments.html" class="nav-item"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Payments</a>
    <a href="admin-reports.html" class="nav-item"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Reports</a>
    <a href="admin-settings.html" class="nav-item"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M5.34 17.66l-1.41 1.41M19.07 19.07l-1.41-1.41M5.34 6.34L3.93 4.93M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>Settings</a>
  </div>
  <div class="sidebar-footer"><a href="login.html" class="nav-item" style="color:#ef4444;"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</a></div>
</aside>

<main class="main">
  <div class="topbar">
    <div><h1>Courses</h1><p>Manage all exam preparation courses</p></div>
    <div class="topbar-right">
      <button class="hamburger" onclick="toggleSidebar()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <button class="cta-btn" onclick="document.getElementById('courseModal').classList.add('open')"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New Course</button>
      <div class="avatar">AD</div>
    </div>
  </div>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-icon purple"><svg width="20" height="20" fill="none" stroke="#7c3aed" stroke-width="2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div><div class="stat-val" id="totalCourses">—</div><div class="stat-lbl">Total Courses</div><span class="stat-change up" id="totalCoursesChange">Loading...</span></div>
    <div class="stat-card"><div class="stat-icon green"><svg width="20" height="20" fill="none" stroke="#16a34a" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="stat-val" id="publishedCourses">—</div><div class="stat-lbl">Published</div></div>
    <div class="stat-card"><div class="stat-icon orange"><svg width="20" height="20" fill="none" stroke="#ea580c" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><div class="stat-val" id="draftCourses">—</div><div class="stat-lbl">Draft / Review</div></div>
    <div class="stat-card"><div class="stat-icon blue"><svg width="20" height="20" fill="none" stroke="#2563eb" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-val" id="totalEnrollments">—</div><div class="stat-lbl">Total Enrollments</div></div>
  </div>

  <div class="course-grid" id="courseGrid">
    <div class="loading">Loading courses...</div>
  </div>
</main>

<!-- New Course Modal -->
<div class="modal-overlay" id="courseModal">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('courseModal').classList.remove('open')">✕</button>
    <h2>Create New Course</h2>
    <div class="form-group"><label>Course Title</label><input type="text" class="form-input" placeholder="e.g. UPSC CSE Foundation 2027"></div>
    <div class="form-row">
      <div class="form-group"><label>Category</label><select class="form-select"><option>UPSC</option><option>SSC</option><option>Banking</option><option>Railway</option><option>State PSC</option></select></div>
      <div class="form-group"><label>Status</label><select class="form-select"><option>Draft</option><option>Published</option></select></div>
    </div>
    <div class="form-group"><label>Description</label><input type="text" class="form-input" placeholder="Short course description…"></div>
    <button class="cta-btn btn-block" onclick="alert('Course created!');document.getElementById('courseModal').classList.remove('open')">Create Course</button>
  </div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<script>
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open');}

const API = '/api';

const emojiMap = {
  'UPSC': '📜', 'SSC': '📊', 'Banking': '🏦', 'Railway': '🚂', 'State PSC': '🏛️', 'General': '📝'
};
const colorMap = {
  'UPSC': 'linear-gradient(90deg,#6366f1,#a5b4fc)',
  'SSC': 'linear-gradient(90deg,#22c55e,#86efac)',
  'Banking': 'linear-gradient(90deg,#f97316,#fdba74)',
  'Railway': 'linear-gradient(90deg,#0ea5e9,#7dd3fc)',
  'State PSC': 'linear-gradient(90deg,#ec4899,#f9a8d4)',
  'General': 'linear-gradient(90deg,#8b5cf6,#c4b5fd)'
};

async function loadCourses() {
  try {
    const res = await fetch(`${API}/courses`);
    let courses = await res.json();
    if (!Array.isArray(courses)) courses = courses.data || courses.courses || [];

    const total = courses.length;
    const published = courses.filter(c => (c.status || '').toLowerCase() === 'published').length;
    const draft = courses.filter(c => (c.status || '').toLowerCase() === 'draft').length;
    const enrollments = courses.reduce((sum, c) => sum + (c.enrolledCount || c.enrolled || 0), 0);

    document.getElementById('totalCourses').textContent = total;
    document.getElementById('totalCoursesChange').textContent = `↑ ${total} total`;
    document.getElementById('publishedCourses').textContent = published;
    document.getElementById('draftCourses').textContent = draft;
    document.getElementById('totalEnrollments').textContent = enrollments.toLocaleString();

    const grid = document.getElementById('courseGrid');
    if (courses.length === 0) {
      grid.innerHTML = '<div class="loading">No courses found</div>';
      return;
    }
    grid.innerHTML = courses.map(c => {
      const name = c.title || c.name || 'Untitled';
      const category = c.category || 'General';
      const emoji = emojiMap[category] || '📚';
      const lessons = c.lessons || c.lessonCount || 0;
      const enrolled = c.enrolledCount || c.enrolled || 0;
      const status = (c.status || 'draft').toLowerCase();
      const tagClass = status === 'published' ? 'active' : 'pending';
      const tagText = status.charAt(0).toUpperCase() + status.slice(1);
      const progress = c.progress || (status === 'published' ? 100 : c.completion || 0);
      const barColor = colorMap[category] || 'linear-gradient(90deg,#8b5cf6,#c4b5fd)';
      const metaParts = [];
      if (category) metaParts.push(category);
      if (lessons) metaParts.push(lessons + ' Lessons');
      if (enrolled) metaParts.push(enrolled.toLocaleString() + ' enrolled');
      return `<div class="course-card"><div class="course-emoji">${emoji}</div><div class="course-title">${name}</div><div class="course-meta">${metaParts.join(' &nbsp;·&nbsp; ')}</div><div class="prog-bar-bg"><div class="prog-bar" style="width:${Math.min(progress,100)}%;background:${barColor};"></div></div><div class="course-footer"><span class="tag ${tagClass}">${tagText}</span><button class="cta-btn" style="padding:6px 12px;font-size:.75rem;">Edit</button></div></div>`;
    }).join('');
  } catch (err) {
    document.getElementById('courseGrid').innerHTML = '<div class="error">Failed to load courses</div>';
    document.querySelectorAll('#statsGrid .stat-val').forEach(el => el.textContent = '—');
    document.querySelectorAll('#statsGrid .stat-change').forEach(el => { if(el) el.textContent = 'Error'; });
  }
}
loadCourses();
</script>
</body>
</html>
