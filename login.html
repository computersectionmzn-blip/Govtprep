<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GovtPrep — Login</title>
  <meta name="description" content="Login to GovtPrep — India's government exam preparation platform">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e0e5ec;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.6;
      animation: floatBlob 8s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .blob-1 {
      top: 8%; left: 10%;
      width: 38vw; height: 38vw;
      max-width: 320px; max-height: 320px;
      background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
    }
    .blob-2 {
      bottom: 8%; right: 10%;
      width: 32vw; height: 32vw;
      max-width: 270px; max-height: 270px;
      background: linear-gradient(135deg, #d4fc79, #96e6a1);
      animation-delay: -4s;
    }
    @keyframes floatBlob {
      0%   { transform: translateY(0) scale(1); }
      100% { transform: translateY(20px) scale(1.04); }
    }

    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
    }

    .login-container {
      width: 100%;
      padding: 40px 36px;
      border-radius: 28px;
      background: rgba(255,255,255,0.32);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 12px 12px 28px rgba(163,177,198,0.72), -12px -12px 28px rgba(255,255,255,0.88);
    }

    .login-header { text-align: center; margin-bottom: 32px; }

    .brand-name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #1e3a8a, #4f46e5 60%, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-header h1 {
      color: #1f2937;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin: 12px 0 4px;
    }

    .login-header p {
      color: #6b7280;
      font-size: 0.85rem;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-group label {
      display: block;
      color: #374151;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
      padding-left: 4px;
    }

    .input-wrapper { position: relative; }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
      transition: color 0.25s;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      font-size: 0.92rem;
      font-family: inherit;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 12px;
      background: rgba(224,229,236,0.45);
      color: #1f2937;
      outline: none;
      transition: all 0.25s;
      box-shadow: inset 3px 3px 6px rgba(163,177,198,0.35), inset -3px -3px 6px rgba(255,255,255,0.75);
    }

    .form-input::placeholder { color: #9ca3af; font-size: 0.87rem; }

    .form-input:focus {
      background: rgba(255,255,255,0.65);
      border-color: rgba(161,196,253,0.7);
      box-shadow: 0 0 0 3px rgba(161,196,253,0.28), inset 1px 1px 3px rgba(163,177,198,0.1);
    }

    .input-wrapper:focus-within .input-icon { color: #4f46e5; }

    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 4px;
      display: flex;
      transition: color 0.2s;
    }
    .toggle-pass:hover { color: #4f46e5; }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      margin-bottom: 22px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      color: #4b5563;
      cursor: pointer;
      gap: 6px;
      user-select: none;
    }

    .remember-me input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #4f46e5;
      cursor: pointer;
    }

    .forgot-link {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.82rem;
    }
    .forgot-link:hover { color: #4338ca; text-decoration: underline; }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: #4f46e5;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(79,70,229,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .submit-btn:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,70,229,0.4); }
    .submit-btn:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(79,70,229,0.3); }
    .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .msg-box {
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .msg-box.error { background: rgba(254,202,202,0.6); border: 1px solid rgba(252,165,165,0.7); color: #b91c1c; }
    .msg-box.success { background: rgba(187,247,208,0.6); border: 1px solid rgba(134,239,172,0.7); color: #15803d; }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      font-size: 0.82rem;
      color: #6b7280;
    }
    .footer-text a { color: #4f46e5; text-decoration: none; font-weight: 600; }
    .footer-text a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .login-container { padding: 28px 20px; border-radius: 22px; }
      .login-header h1 { font-size: 1.2rem; }
      .brand-name { font-size: 1.3rem; }
      .form-options { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js",
      "firebase/analytics": "https://www.gstatic.com/firebasejs/11.0.1/firebase-analytics.js"
    }
  }
  </script>
  <script type="module" src="firebase-init.js"></script>
</head>
<body>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="login-wrapper">
    <div class="login-container">

      <div class="login-header">
        <span class="brand-name">GovtPrep</span>
        <h1>Welcome Back</h1>
        <p>Sign in to continue</p>
      </div>

      <div id="msg-box" class="msg-box" role="alert"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">

        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="form-input"
              placeholder="you@example.com" required autocomplete="email"
              spellcheck="false" autofocus>
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input"
              placeholder="Enter your password" required autocomplete="current-password"
              minlength="6" spellcheck="false">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <button type="button" class="toggle-pass" onclick="togglePassword()" aria-label="Toggle password visibility">
              <svg id="eyeOpen" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeClosed" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember"> Remember me
          </label>
          <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="submit-btn" id="loginBtn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign In
        </button>
      </form>

      <div class="footer-text">
        New to GovtPrep? <a href="register.html">Create account</a>
      </div>

    </div>
  </div>

  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const open = document.getElementById('eyeOpen');
      const closed = document.getElementById('eyeClosed');
      if (pwd.type === 'password') {
        pwd.type = 'text'; open.style.display = 'none'; closed.style.display = 'block';
      } else {
        pwd.type = 'password'; open.style.display = 'block'; closed.style.display = 'none';
      }
    }

    function showMsg(text, type) {
      const box = document.getElementById('msg-box');
      box.textContent = text;
      box.className = 'msg-box ' + type;
      box.style.display = 'block';
    }

    const API = 'https://govtprep.onrender.com/api';

    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      if (!email) { showMsg('Please enter your email.', 'error'); return; }
      if (password.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }

      btn.disabled = true;
      btn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><circle cx="12" cy="12" r="10" stroke-dasharray="40" stroke-dashoffset="10"/></svg> Signing In…';

      fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })
        .then(res => res.json())
        .then(({ data }) => {
          if (!data || !data.token) throw new Error('Invalid credentials');
          localStorage.setItem('token', data.token);
          localStorage.setItem('userId', data.user._id);
          localStorage.setItem('userName', data.user.name);
          localStorage.setItem('userRole', data.user.role);
          btn.innerHTML = '✓ Signed In';
          const dest = data.user.role === 'admin' ? 'admin-dashboard.html' : 'student-dashboard.html';
          setTimeout(() => { window.location.href = dest; }, 800);
        })
        .catch(err => {
          showMsg('Invalid email or password.', 'error');
          btn.disabled = false;
          btn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In';
        });
    }
  </script>

  <style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>

</body>
</html>
